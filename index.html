<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>КБЖУ</title>
  <link rel="stylesheet" href="style.css?v=3.0.0" />
</head>
<body>
  <div class="app">
    <h1>КБЖУ по весу (v3.0)</h1>

    <div class="app-shell">
      <div class="main-column">
        <div class="card">

          <!-- НАЗВАНИЕ + КОМПАНИЯ -->
          <div class="title-row">
            <input
              type="text"
              id="title"
              placeholder="Название (необязательно)"
              maxlength="40"
            />

            <input
              type="text"
              id="company"
              list="companyList"
              placeholder="Фирма"
            />

            <datalist id="companyList"></datalist>
          </div>

          <div class="inputs">
            <div class="icon-input">
              <div class="ii-icon">🔥</div>
              <input type="number" step="0.1" min="0" placeholder="Ккал / 100г" id="k" />
            </div>

            <div class="icon-input">
              <div class="ii-icon">💪</div>
              <input type="number" step="0.1" min="0" placeholder="Белки / 100г" id="b" />
            </div>

            <div class="icon-input">
              <div class="ii-icon">🥑</div>
              <input type="number" step="0.1" min="0" placeholder="Жиры / 100г" id="j" />
            </div>

            <div class="icon-input">
              <div class="ii-icon">🌾</div>
              <input type="number" step="0.1" min="0" placeholder="Углеводы / 100г" id="u" />
            </div>
          </div>

          <div class="weight-row">
            <input type="number" min="0" step="1" placeholder="Вес (г)" id="weight" />
            <label class="checkline inrow">
              <input type="checkbox" id="perPortion" />
              <span>На порцию</span>
            </label>
          </div>

          <div class="add-wrap">
            <button id="add" class="btn primary btn-full">Добавить</button>
          </div>

          <p class="hint" id="hint"></p>
        </div>

        <div class="card action-panel">
          <div class="toolbar">
            <a class="page-link" href="./products.html">Продукты</a>
          </div>
        </div>

        <div class="card">
          <div class="section-head results-head">
            <h2>Результаты</h2>

            <div class="results-actions">
              <button id="copyTotals" class="btn ghost">Копировать</button>
              <button id="clear" class="icon-btn danger" title="Очистить список">✕</button>
            </div>
          </div>

          <div class="totals-grid" id="totalsGrid">
            <div class="total-card t-k">
              <div class="t-ico">🔥</div>
              <div class="t-title">КАЛОРИИ <span class="t-unit">ккал</span></div>
              <div class="t-val"><span id="sumK">0.0</span></div>
            </div>

            <div class="total-card t-b">
              <div class="t-ico">💪</div>
              <div class="t-title">БЕЛКИ <span class="t-unit">г</span></div>
              <div class="t-val"><span id="sumB">0.0</span></div>
            </div>

            <div class="total-card t-j">
              <div class="t-ico">🥑</div>
              <div class="t-title">ЖИРЫ <span class="t-unit">г</span></div>
              <div class="t-val"><span id="sumJ">0.0</span></div>
            </div>

            <div class="total-card t-u">
              <div class="t-ico">🌾</div>
              <div class="t-title">УГЛЕВОДЫ <span class="t-unit">г</span></div>
              <div class="t-val"><span id="sumU">0.0</span></div>
            </div>
          </div>

          <div id="list"></div>
        </div>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="style.css?v=3.0.1" />
  <script type="module" src="main.js?v=3.0.1"></script>
</body>
</html>
