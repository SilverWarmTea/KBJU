<div class="product-card">
  <div class="product-card__grid">

    <div class="product-card__box product-card__box--info">
      <div class="product-card__title">Parmalat капучино 250 мл</div>
      <div class="product-card__company">Фирма: Parmalat</div>
    </div>

    <div class="product-card__box product-card__box--mode">
      <div class="product-card__meta">Режим: поштучно</div>
      <div class="product-card__meta">База: 1 шт</div>
    </div>

    <div class="product-card__box product-card__box--extra">
      <div class="product-card__extra-title">Запасы</div>
      <div class="product-card__extra-text">Осталось: 3 шт</div>
    </div>

    <div class="product-card__box product-card__box--macros">
      <div class="product-card__macros">
        <div class="product-card__pill product-card__pill--k">
          <span class="product-card__pill-label">🔥 Калории</span>
          <span class="product-card__pill-value">69</span>
        </div>

        <div class="product-card__pill product-card__pill--b">
          <span class="product-card__pill-label">💪 Белки</span>
          <span class="product-card__pill-value">3</span>
        </div>

        <div class="product-card__pill product-card__pill--j">
          <span class="product-card__pill-label">🥑 Жиры</span>
          <span class="product-card__pill-value">1.5</span>
        </div>

        <div class="product-card__pill product-card__pill--u">
          <span class="product-card__pill-label">🌾 Углеводы</span>
          <span class="product-card__pill-value">10.8</span>
        </div>
      </div>
    </div>

    <div class="product-card__box product-card__box--actions">
      <button type="button" class="product-card__action-btn">Добавить</button>
      <button type="button" class="product-card__action-btn">Списать</button>
      <button type="button" class="product-card__action-btn">Редактировать</button>
      <button type="button" class="product-card__action-btn">Удалить</button>
    </div>

  </div>
</div>
