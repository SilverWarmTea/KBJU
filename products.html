<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Продукты</title>
  <link rel="stylesheet" href="style.css?v=4.0.0" />
  <link rel="stylesheet" href="products.css?v=4.0.0" />
</head>
<body>
  <div class="app">
    <h1>Продукты</h1>

    <div class="card action-panel">
      <div class="toolbar main-toolbar">
        <a class="page-link" href="./index.html">Главная</a>
        <span class="page-link page-link-current">Продукты</span>
        <a class="page-link" href="./stocks.html">Запасы</a>
        <a class="page-link" href="./calculator.html">Калькулятор</a>
      </div>
      <p class="hint main-menu-hint">Нажми на продукт — он добавится в результаты.</p>
    </div>

    <div class="card products-page-card">
      <div class="section-head results-head">
        <h2>Список продуктов</h2>
      </div>

    <div class="products-filters">
  <div class="products-search-input-wrap">
    <span class="products-search-icon" aria-hidden="true">🔎</span>
    <input
      type="text"
      id="productsSearch"
      class="products-search-input"
      placeholder="Введите название продукта..."
      maxlength="60"
      autocomplete="off"
    />
  </div>

  <select id="productsCompany" class="products-company-select" aria-label="Фильтр по фирме">
    <option value="__all__">Все</option>
  </select>
</div>

      <div id="productsList" class="products-list"></div>
    </div>
  </div>

  <script type="module" src="productsPage.js?v=3.0.2Ы"></script>
</body>
</html>
