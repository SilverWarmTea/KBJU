<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>КБЖУ</title>
  <link rel="stylesheet" href="../style.css?v=4.2.2" />
  <link rel="stylesheet" href="index.css?v=4.2.2" />
  <link rel="stylesheet" href="../shared/product-card.css?v=4.2.2" />

</head>
<body>
  <div class="app">
    <h1>КБЖУ по весу (v3.0)</h1>

    <div class="app-shell">
      <div class="main-column">
        <div class="card">

  <div class="quick-input-row">
    <input
      type="text"
      id="quickInput"
      placeholder="Быстрый ввод: К 120 Б 10 Ж 3 У 15 В 200"
      maxlength="120"
      autocomplete="off"
    />
  </div>

  <!-- НАЗВАНИЕ + КОМПАНИЯ -->
  <div class="editor-grid">
  <div class="editor-inline-input editor-row-full">
    <span class="editor-ico">🏷️</span>
    <input id="title" type="text" placeholder="Название" />
  </div>

  <div class="editor-inline-input">
    <span class="editor-ico">🏢</span>
    <input id="company" list="companyList" type="text" placeholder="Фирма" />
    <datalist id="companyList"></datalist>
  </div>

  <div class="editor-inline-input">
    <span class="editor-ico">⚖️</span>
    <input id="weight" type="text" placeholder="Количество (г или шт)" />
  </div>

  <div class="editor-row-full editor-mode-row">
    <button type="button" id="modeWeight" class="editor-mode-btn is-active">По весу</button>
    <button type="button" id="modeUnit" class="editor-mode-btn">Поштучно</button>
  </div>

  <div class="editor-inline-input">
    <span class="editor-ico">🔥</span>
    <input id="k" type="text" placeholder="Калории" />
  </div>

  <div class="editor-inline-input">
    <span class="editor-ico">💪</span>
    <input id="b" type="text" placeholder="Белки" />
  </div>

  <div class="editor-inline-input">
    <span class="editor-ico">🥑</span>
    <input id="j" type="text" placeholder="Жиры" />
  </div>

  <div class="editor-inline-input">
    <span class="editor-ico">🌾</span>
    <input id="u" type="text" placeholder="Углеводы" />
  </div>
</div>

          <div class="add-wrap">
            <button id="add" class="btn primary btn-full">Добавить</button>
          </div>

          <p class="hint" id="hint"></p>
        </div>

        <div class="card action-panel">
          <div class="toolbar main-toolbar">
            <span class="page-link page-link-current">Главная</span>
            <a class="page-link" href="../products/products.html">Продукты</a>
            <a class="page-link" href="../stocks/stocks.html">Запасы</a>
            <a class="page-link" href="../calculator/calculator.html">Калькулятор</a>
          </div>
          <p class="hint main-menu-hint">Быстрый переход между разделами.</p>
        </div>

        <div class="card">
          <div class="section-head results-head">
            <h2>Результаты</h2>

            <div class="results-actions">
              <button id="copyTotals" class="btn ghost">Копировать</button>
              <button id="clear" class="icon-btn danger" title="Очистить список">✕</button>
            </div>
          </div>

          <div class="totals-grid" id="totalsGrid">
            <div class="total-card t-k">
              <div class="t-ico">🔥</div>
              <div class="t-title">КАЛОРИИ <span class="t-unit">ккал</span></div>
              <div class="t-val"><span id="sumK">0.0</span></div>
            </div>

            <div class="total-card t-b">
              <div class="t-ico">💪</div>
              <div class="t-title">БЕЛКИ <span class="t-unit">г</span></div>
              <div class="t-val"><span id="sumB">0.0</span></div>
            </div>

            <div class="total-card t-j">
              <div class="t-ico">🥑</div>
              <div class="t-title">ЖИРЫ <span class="t-unit">г</span></div>
              <div class="t-val"><span id="sumJ">0.0</span></div>
            </div>

            <div class="total-card t-u">
              <div class="t-ico">🌾</div>
              <div class="t-title">УГЛЕВОДЫ <span class="t-unit">г</span></div>
              <div class="t-val"><span id="sumU">0.0</span></div>
            </div>
          </div>

          <div id="list"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="copyModalBackdrop">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="copyModalTitle">
    <div class="modal-head">
      <h2 id="copyModalTitle">Копирование итогов</h2>
      <button type="button" class="icon-btn danger" id="copyModalClose" title="Закрыть">✕</button>
    </div>

    <div class="modal-body">
      <div class="copy-modal-grid">
        <div class="field-block">
          <label for="copyDate">Дата</label>
          <input type="date" id="copyDate" />
        </div>

        <div class="field-block">
          <label for="copyActivity">Активность</label>
          <select id="copyActivity">
            <option value="зал">зал</option>
            <option value="волейбол">волейбол</option>
            <option value="отдых">отдых</option>
          </select>
        </div>
      </div>

      <div class="copy-preview-wrap">
        <div class="copy-preview-title">Предпросмотр</div>
        <div class="copy-preview" id="copyPreview"></div>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn ghost" id="copyModalConfirm">Копировать</button>
    </div>
  </div>
</div>
  <script type="module" src="main.js?v=3.0.1"></script>
</body>
</html>
