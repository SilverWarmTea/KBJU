<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Калькулятор блюда</title>
  <link rel="stylesheet" href="style.css?v=4.0.0" />
  <link rel="stylesheet" href="calculator.css?v=4.0.0" />
</head>
<body>
  <div class="app">
    <h1>Калькулятор блюда</h1>

    <div class="card action-panel">
      <div class="toolbar main-toolbar">
        <a class="page-link" href="./index.html">Главная</a>
        <a class="page-link" href="./products.html">Продукты</a>
        <a class="page-link" href="./stocks.html">Запасы</a>
        <span class="page-link page-link-current">Калькулятор</span>
      </div>
      <p class="hint main-menu-hint">Вводи ингредиенты построчно. Итог считается автоматически.</p>
    </div>

    <div class="card">
      <div id="calcRows" class="calc-rows"></div>

      <div class="calc-add-wrap">
        <button id="addCalcRow" class="btn ghost" type="button" disabled>Добавить ингредиент</button>
      </div>
    </div>

    <div class="card">
      <div class="section-head results-head">
        <h2>Итог блюда</h2>
      </div>

      <div class="calc-result-row">
        <input
          type="text"
          id="resultTitle"
          placeholder="Название итогового блюда"
          maxlength="60"
        />
      </div>
    
      <div class="calc-heat-row">
  <label class="checkline inrow calc-heat-check">
    <input type="checkbox" id="heatTreatment" />
    <span>Тепловая обработка</span>
  </label>

  <input
    type="number"
    id="cookedWeight"
    placeholder="Вес после готовки"
    min="0"
    step="1"
    disabled
  />
</div>

      <div class="calc-result-grid">
        
        <div class="macro-pill">
          <div class="macro-left">🔥 Калории</div>
          <div class="macro-val" id="resultK">0.0</div>
        </div>

        <div class="macro-pill">
          <div class="macro-left">💪 Белки</div>
          <div class="macro-val" id="resultB">0.0</div>
        </div>

        <div class="macro-pill">
          <div class="macro-left">🥑 Жиры</div>
          <div class="macro-val" id="resultJ">0.0</div>
        </div>

        <div class="macro-pill">
          <div class="macro-left">🌾 Углеводы</div>
          <div class="macro-val" id="resultU">0.0</div>
        </div>

        <div class="macro-pill">
          <div class="macro-left">⚖️ Вес</div>
          <div class="macro-val" id="resultW">0</div>
        </div>
      </div>
      <div class="calc-save-wrap">
          <button id="saveToStocks" class="btn ghost" type="button">Перенести в запасы</button>
        </div>
    </div>
    
  </div>

  <script type="module" src="calculator.js?v=4.0.0"></script>
</body>
</html>
